<!doctype html>
<html lang="lo">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;600;700;800;900&family=Inter:wght@500;600;700;800;900&display=block">
<style>
  :root {
    --bg1: #0b1220; --bg2: #121c33; --gold: #f5b800; --gold2: #ffd54a;
    --red: #f04452; --green: #22c55e; --blue: #3b82f6; --orange: #f59e0b;
    --row: #161f33; --rowb: #26314a; --muted: #8b95ab; --white: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  body {
    font-family: 'Inter', 'Noto Sans Lao', sans-serif; color: var(--white);
    background: radial-gradient(1200px 900px at 50% 38%, #18264a 0%, var(--bg2) 35%, var(--bg1) 80%);
  }
  .lao { font-family: 'Noto Sans Lao', 'Inter', sans-serif; }
  /* ---------- header ---------- */
  .hdr { position: absolute; left: 40px; top: 48px; right: 40px; height: 132px; display: flex; align-items: center; gap: 26px; }
  .logo { width: 160px; height: 124px; border-radius: 18px; background: linear-gradient(160deg, #1d2740, #0c1322);
          border: 2px solid #2e3a58; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .logo .brand { font: 800 19px 'Inter', 'Noto Sans Lao'; color: var(--gold2); margin-top: 4px; letter-spacing: .3px; text-align: center; line-height: 1.1; }
  .ttl { font: 900 66px/1.15 'Noto Sans Lao', 'Inter'; }
  .ttl b { color: var(--gold); font-weight: 900; }
  .sub { font: 600 28px/1.3 'Noto Sans Lao', 'Inter'; color: #c4ccda; margin-top: 4px; }
  .sub .sym { color: #fff; font-weight: 800; font-family: 'Inter'; }
  /* ---------- chart card ---------- */
  .card { position: absolute; left: 28px; right: 28px; top: 212px; height: 920px; border-radius: 26px; overflow: hidden;
          background: #fff; border: 3px solid #c9a227; box-shadow: 0 18px 50px rgba(0,0,0,.45); }
  .card.dark { background: transparent; border: none; box-shadow: none; overflow: visible; }
  .card svg { position: absolute; left: 0; top: 0; }
  .tf { position: absolute; left: 22px; top: 22px; display: flex; align-items: center; gap: 14px; background: #121a2c;
        border-radius: 14px; padding: 10px 20px 10px 12px; z-index: 3; }
  .tf .b { background: var(--gold); color: #111; font: 900 34px 'Inter'; border-radius: 10px; padding: 2px 12px; }
  .tf .t1 { font: 800 30px/1.15 'Noto Sans Lao', 'Inter'; color: #fff; }
  .tf .t2 { font: 600 21px/1.1 'Noto Sans Lao', 'Inter'; color: #aab3c5; }
  .foot { position: absolute; left: 0; right: 0; bottom: 0; height: 62px; background: #0f1626; display: flex; align-items: center;
          justify-content: space-between; padding: 0 22px; font: 600 23px 'Inter', 'Noto Sans Lao'; color: #e6e9ef; }
  .foot .src { color: var(--gold2); font-weight: 800; }
  /* ---------- caption & rows ---------- */
  .cap { position: absolute; left: 40px; right: 40px; top: 1180px; text-align: center; font: 900 74px/1.25 'Noto Sans Lao', 'Inter';
         text-shadow: 0 4px 18px rgba(0,0,0,.5); }
  .cap .g { color: var(--green); } .cap .r { color: var(--red); } .cap .y { color: var(--gold); } .cap .bl { color: #5b9bff; }
  .below { position: absolute; left: 40px; right: 40px; top: 1340px; }
  .tag { display: inline-flex; align-items: center; font: 800 31px 'Noto Sans Lao', 'Inter'; padding: 10px 26px; border-radius: 40px; margin-bottom: 20px; }
  .tag.red { color: #ff8a94; background: rgba(240,68,82,.16); border: 2px solid rgba(240,68,82,.6); }
  .tag.blue { color: #8db8ff; background: rgba(59,130,246,.16); border: 2px solid rgba(59,130,246,.6); }
  .tag.gray { color: #d7dce6; background: rgba(255,255,255,.07); border: 2px solid rgba(255,255,255,.2); }
  .row { display: flex; align-items: center; height: 104px; background: var(--row); border: 2px solid var(--rowb); border-radius: 18px;
         padding: 0 30px 0 22px; margin-bottom: 16px; }
  .ic { width: 52px; height: 52px; border-radius: 12px; display: flex; align-items: center; justify-content: center;
        font: 900 28px 'Inter', 'Noto Sans Lao'; color: #fff; flex: none; }
  .row .lb { margin-left: 22px; font: 700 36px 'Noto Sans Lao', 'Inter'; color: #e9edf4; flex: 1; white-space: nowrap; }
  .row .vl { font: 900 42px 'Inter', 'Noto Sans Lao'; color: var(--gold); white-space: nowrap; }
  .c-red { background: var(--red); } .c-green { background: var(--green); } .c-blue { background: var(--blue); }
  .c-gold { background: var(--gold); color: #111 !important; } .c-gray { background: #4b5569; } .c-orange { background: var(--orange); }
  .v-red { color: var(--red) !important; } .v-green { color: var(--green) !important; } .v-blue { color: #5b9bff !important; } .v-white { color: #fff !important; }
  .disc { position: absolute; left: 0; right: 0; bottom: 46px; text-align: center; font: 600 25px 'Noto Sans Lao', 'Inter'; color: #8b95ab; }
  .disc b { color: #c9cfdb; }
  /* ---------- cards ---------- */
  .panel { position: absolute; left: 0; right: 0; top: 30px; background: linear-gradient(170deg, #1a2440, #0f1729); border: 2px solid #33405f;
           border-radius: 26px; padding: 44px 44px 40px; box-shadow: 0 18px 50px rgba(0,0,0,.5); }
  .panel h2 { font: 900 50px 'Noto Sans Lao', 'Inter'; display: flex; align-items: baseline; gap: 16px; }
  .panel h2 small { font: 600 26px 'Noto Sans Lao'; color: var(--muted); }
  .pbar { margin-top: 34px; }
  .pbar .lbl { display: flex; justify-content: space-between; font: 800 34px 'Noto Sans Lao', 'Inter'; }
  .pbar .track { display: flex; height: 40px; border-radius: 20px; overflow: hidden; margin-top: 14px; }
  .reason { display: flex; align-items: center; gap: 20px; margin-top: 24px; font: 700 34px 'Noto Sans Lao', 'Inter'; color: #e9edf4; }
  .note { margin-top: 30px; text-align: center; font: 700 28px 'Noto Sans Lao'; color: var(--gold2); }
  .nrow { display: flex; align-items: center; gap: 18px; padding: 20px 0; border-bottom: 1px solid #2a3552; font: 700 33px 'Noto Sans Lao', 'Inter'; }
  .nrow:last-child { border-bottom: none; }
  .nrow .k { font: 800 22px 'Noto Sans Lao', 'Inter'; padding: 6px 12px; border-radius: 8px; min-width: 96px; text-align: center; }
  .nrow .n { flex: 1; color: #e9edf4; }
  .nrow .v { font: 900 38px 'Inter'; }
  .poll { display: flex; gap: 26px; margin-top: 36px; }
  .poll div { flex: 1; height: 150px; border-radius: 20px; display: flex; align-items: center; justify-content: center; font: 900 50px 'Noto Sans Lao', 'Inter'; }
  .outro { position: absolute; left: 0; right: 0; top: 520px; text-align: center; }
  .outro .lg { width: 360px; height: 280px; margin: 0 auto; border-radius: 30px; background: linear-gradient(160deg, #1d2740, #0c1322);
               border: 3px solid #3a4870; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 0 120px rgba(245,184,0,.25); }
  .outro .lg .brand { font: 900 38px 'Inter', 'Noto Sans Lao'; color: var(--gold2); margin-top: 10px; }
  .outro h1 { margin-top: 60px; font: 900 92px 'Noto Sans Lao'; }
  .outro p { margin-top: 18px; font: 700 38px 'Noto Sans Lao', 'Inter'; color: var(--gold); }
</style>
</head>
<body>
<div id="root"></div>
<script>
const NS = 'http://www.w3.org/2000/svg';
const COL = { red: '#f04452', green: '#16a34a', blue: '#2563eb', orange: '#f59e0b', black: '#111827', yellow: '#f5b800', gray: '#6b7280' };
const UP = '#089981', DN = '#f23645';
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
const fmt = v => Number(v).toLocaleString('en-US', { maximumFractionDigits: 1 });
const capHtml = s => esc(s).replace(/\[(g|r|y|bl)\]/g, '<span class="$1">').replace(/\[\/(g|r|y|bl)\]/g, '</span>');

function logoSvg(size) {
  // ไอคอนแท่งทองคำ 3 แท่ง + ลูกศรขึ้น (ออกแบบเอง ไม่อิงโลโก้ช่องอื่น)
  return `<svg width="${size}" height="${size * 0.62}" viewBox="0 0 100 62">
    <defs><linearGradient id="gb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe27a"/><stop offset="1" stop-color="#c98b00"/></linearGradient></defs>
    <polygon points="8,58 14,40 40,40 46,58" fill="url(#gb)"/><polygon points="54,58 60,40 86,40 92,58" fill="url(#gb)"/>
    <polygon points="31,38 37,20 63,20 69,38" fill="url(#gb)"/>
    <polyline points="20,22 38,8 52,16 76,2" fill="none" stroke="#ffe27a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="70,0 82,0 80,11" fill="#ffe27a"/></svg>`;
}

function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}

function pillSvg(svg, x, y, text, color, anchor) {
  // ป้ายแคปซูลสีทึบตัวขาว วางให้จุด (x,y) อยู่ที่ขอบตาม anchor
  const g = el('g', {}, svg);
  const t = el('text', { x: 0, y: 0, 'font-family': 'Inter, Noto Sans Lao', 'font-weight': 800, 'font-size': 30, fill: color === 'yellow' ? '#111' : '#fff' }, g);
  t.textContent = text;
  const w = t.getComputedTextLength() + 34, h = 50;
  let x0 = x - w / 2, y0 = y - h / 2;
  if (anchor === 'above') y0 = y - h - 14;
  if (anchor === 'below') y0 = y + 14;
  if (anchor === 'left') { x0 = x; }
  if (anchor === 'right') { x0 = x - w; }
  x0 = Math.max(8, Math.min(x0, svg.__plotW - w - 6));
  const r = el('rect', { x: x0, y: y0, width: w, height: h, rx: 25, fill: COL[color] || color }, g);
  g.insertBefore(r, t);
  t.setAttribute('x', x0 + 17); t.setAttribute('y', y0 + 35);
  return g;
}

function drawChart(card, C) {
  const W = card.clientWidth, H = card.clientHeight - 62;
  const axisW = 132, top = 110, bottom = 60;
  const plotW = W - axisW, plotH = H - top - bottom;
  const svg = el('svg', { width: W, height: H }, card);
  svg.__plotW = plotW;
  el('rect', { x: 0, y: 0, width: W, height: H, fill: '#ffffff' }, svg);
  const bars = C.bars, n = bars.length, slots = n + C.padRight;
  const step = plotW / slots, bw = Math.max(2, step * 0.68);
  const lo = C.ymin, hi = C.ymax;
  const X = i => (i + 0.5) * step;
  const Y = v => top + (hi - v) / (hi - lo) * plotH;
  // grid + price axis
  const ticks = C.ticks;
  for (const v of ticks) {
    el('line', { x1: 0, x2: plotW, y1: Y(v), y2: Y(v), stroke: '#eef0f3', 'stroke-width': 2 }, svg);
    const t = el('text', { x: plotW + 14, y: Y(v) + 9, 'font-family': 'Inter', 'font-size': 24, 'font-weight': 500, fill: '#4b5563' }, svg);
    t.textContent = fmt(v);
  }
  for (const L of C.xlabels) {
    el('line', { x1: X(L.i), x2: X(L.i), y1: top - 40, y2: top + plotH, stroke: '#f3f4f6', 'stroke-width': 2 }, svg);
    const t = el('text', { x: X(L.i), y: H - 20, 'text-anchor': 'middle', 'font-family': 'Inter', 'font-size': 24, 'font-weight': 500, fill: '#4b5563' }, svg);
    t.textContent = L.t;
  }
  el('line', { x1: plotW, x2: plotW, y1: 0, y2: H, stroke: '#e5e7eb', 'stroke-width': 2 }, svg);
  const g0 = el('g', {}, svg);   // zones/boxes อยู่ใต้แท่งเทียน
  // candles
  bars.forEach((b, i) => {
    const c = b[3] >= b[0] ? UP : DN;
    el('line', { x1: X(i), x2: X(i), y1: Y(b[1]), y2: Y(b[2]), stroke: c, 'stroke-width': Math.max(1.5, step * 0.12) }, svg);
    const y1 = Y(Math.max(b[0], b[3])), y2 = Y(Math.min(b[0], b[3]));
    el('rect', { x: X(i) - bw / 2, y: y1, width: bw, height: Math.max(2, y2 - y1), fill: c }, svg);
  });
  // last price tag on axis
  const last = bars[n - 1][3], lc = bars[n - 1][3] >= bars[n - 1][0] ? UP : DN;
  el('line', { x1: 0, x2: plotW, y1: Y(last), y2: Y(last), stroke: lc, 'stroke-width': 1.5, 'stroke-dasharray': '3 5' }, svg);
  el('rect', { x: plotW + 4, y: Y(last) - 20, width: axisW - 8, height: 40, rx: 6, fill: lc }, svg);
  const lt = el('text', { x: plotW + 14, y: Y(last) + 9, 'font-family': 'Inter', 'font-size': 24, 'font-weight': 800, fill: '#fff' }, svg);
  lt.textContent = fmt(last);
  // annotations
  for (const a of (C.ann || [])) {
    const col = COL[a.color] || a.color || COL.red;
    if (a.type === 'zone') {
      el('rect', { x: 0, y: Y(a.y2), width: plotW, height: Math.max(6, Y(a.y1) - Y(a.y2)), fill: col, opacity: 0.2 }, g0);
      if (a.label) pillSvg(svg, a.lx != null ? X(a.lx) : 18, (Y(a.y1) + Y(a.y2)) / 2, a.label, a.color, a.lx != null ? 'center' : 'left');
    } else if (a.type === 'box') {
      el('rect', { x: X(a.x1), y: Y(a.y2), width: X(a.x2) - X(a.x1), height: Y(a.y1) - Y(a.y2), fill: col, opacity: 0.22, stroke: col, 'stroke-width': 2 }, g0);
      if (a.label) pillSvg(svg, X(a.x2), Y(a.y2), a.label, a.color, 'above');
    } else if (a.type === 'hline') {
      el('line', { x1: a.from != null ? X(a.from) : 0, x2: plotW, y1: Y(a.y), y2: Y(a.y), stroke: col, 'stroke-width': 4, 'stroke-dasharray': a.solid ? '' : '14 10' }, svg);
      if (a.label) pillSvg(svg, a.lx != null ? X(a.lx) : 18, Y(a.y), a.label, a.color, a.lx != null ? 'center' : 'left');
    } else if (a.type === 'path') {
      const pts = a.pts.map(p => `${X(p[0])},${Y(p[1])}`).join(' ');
      el('polyline', { points: pts, fill: 'none', stroke: col, 'stroke-width': 7, 'stroke-linejoin': 'round', 'stroke-linecap': 'round', opacity: a.thin ? 0.85 : 1 }, svg);
      if (a.arrow) {
        const [p1, p2] = a.pts.slice(-2).map(p => [X(p[0]), Y(p[1])]);
        const ang = Math.atan2(p2[1] - p1[1], p2[0] - p1[0]), L = 30;
        const ah = [[p2[0], p2[1]], [p2[0] - L * Math.cos(ang - 0.45), p2[1] - L * Math.sin(ang - 0.45)], [p2[0] - L * Math.cos(ang + 0.45), p2[1] - L * Math.sin(ang + 0.45)]];
        el('polygon', { points: ah.map(p => p.join(',')).join(' '), fill: col }, svg);
      }
    } else if (a.type === 'pill') {
      if (a.dot !== false) el('circle', { cx: X(a.x), cy: Y(a.y), r: 9, fill: '#fff', stroke: col, 'stroke-width': 5 }, svg);
      pillSvg(svg, X(a.x), Y(a.y), a.text, a.color, a.pos || 'above');
    }
  }
}

function render(S) {
  const R = document.getElementById('root');
  const head = `
    <div class="hdr"><div class="logo">${logoSvg(104)}<div class="brand">${esc(S.brand)}</div></div>
      <div><div class="ttl">ແຜນເທຣດຄຳ<b>ປະຈຳວັນ</b></div>
      <div class="sub"><span class="sym">XAUUSD</span> · ${esc(S.subtitle)}</div></div></div>`;
  const disc = `<div class="disc"><b>ບໍ່ແມ່ນຄຳແນະນຳການລົງທຶນ</b> · ມຸມມອງທາງເຕັກນິກເພື່ອການສຶກສາ · ການເທຣດມີຄວາມສ່ຽງ</div>`;
  if (S.kind === 'outro') {
    R.innerHTML = `<div class="outro"><div class="lg">${logoSvg(200)}<div class="brand">${esc(S.brand)}</div></div>
      <h1>ແຜນເທຣດຄຳປະຈຳວັນ</h1><p>${esc(S.brand)} · XAUUSD ທຸກມື້</p></div>`;
    return;
  }
  let body = '';
  const rows = (S.rows || []).map(r => `<div class="row"><div class="ic c-${r.c || 'gray'}">${esc(r.i)}</div>
      <div class="lb">${esc(r.l)}</div><div class="vl ${r.vc ? 'v-' + r.vc : ''}">${esc(r.v)}</div></div>`).join('');
  const tag = S.tag ? `<div class="tag ${S.tag.c}">${esc(S.tag.t)}</div>` : '';
  if (S.kind === 'chart') {
    body = `<div class="card" id="card"><div class="tf"><div class="b">${esc(S.chart.tf)}</div><div><div class="t1">${esc(S.chart.tfName)}</div><div class="t2">${esc(S.chart.tfSub || '')}</div></div></div>
      <div class="foot"><span><span class="src">${esc(S.source)}</span></span><span>${esc(S.stamp)}</span></div></div>`;
  } else if (S.kind === 'prob') {
    const P = S.prob;
    body = `<div class="card dark"><div class="panel">
      <h2>ມຸມມອງຄວາມເປັນໄປໄດ້ <small>ຈາກເຕັກນິກ</small></h2>
      <div class="pbar"><div class="lbl"><span style="color:#ff6b77">▼ ຝັ່ງລົງ ${P.down}%</span><span style="color:#6ea8ff">▲ ດີດ ${P.up}%</span></div>
      <div class="track"><div style="width:${P.down}%;background:linear-gradient(90deg,#f04452,#ff7a59)"></div><div style="flex:1;background:linear-gradient(90deg,#3b82f6,#60a5fa)"></div></div></div>
      ${(P.reasons || []).map(x => `<div class="reason"><div class="ic c-${x.c}">${esc(x.i)}</div><div>${esc(x.t)}</div></div>`).join('')}
      ${P.note ? `<div class="note">${esc(P.note)}</div>` : ''}</div></div>`;
  } else if (S.kind === 'numbers') {
    body = `<div class="card dark"><div class="panel"><h2>🔖 ຕົວເລກສຳຄັນມື້ນີ້ <small>XAUUSD · ${esc(S.dateShort)}</small></h2>
      ${S.numbers.map(x => `<div class="nrow"><span class="k c-${x.c}" style="color:#fff">${esc(x.k)}</span><span class="n">${esc(x.n)}</span><span class="v ${x.vc ? 'v-' + x.vc : ''}" style="${x.vc ? '' : 'color:var(--gold)'}">${esc(x.v)}</span></div>`).join('')}
      </div></div>`;
  } else if (S.kind === 'poll') {
    body = `<div class="card dark"><div class="panel" style="text-align:center"><h2 style="justify-content:center;font-size:62px">${esc(S.poll.q)}</h2>
      <div class="poll"><div style="background:rgba(240,68,82,.15);border:3px solid #f04452;color:#ff7a85">▼ ${esc(S.poll.a)}</div>
      <div style="background:rgba(59,130,246,.15);border:3px solid #3b82f6;color:#7fb0ff">▲ ${esc(S.poll.b)}</div></div>
      <div class="note" style="color:#9aa4b8">ຄອມເມັ້ນບອກແອດແດ່ 👇</div></div></div>`;
  }
  R.innerHTML = head + body + `<div class="cap">${capHtml(S.caption || '')}</div><div class="below">${tag}${rows}</div>` + disc;
  if (S.kind === 'chart') drawChart(document.getElementById('card'), S.chart);
}
window.renderShot = render;
</script>
</body>
</html>
